<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="826" viewBox="0 0 1040 826" role="img" aria-labelledby="title desc">
  <title id="title">N4 native video engine architecture</title>
  <desc id="desc">The CLI, SDL2 viewer and Electron harness share one standalone Rust engine. Its evaluator resolves text layout, layer transforms and timing. Footage, graphics and spatial scenes feed a compositor that applies filters to layers and groups. The composed picture and mixed audio feed playback and export.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#496477"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #182d3b; }
      .title { font-size: 27px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 16px; }
      .tag { font-size: 13px; fill: #415769; font-weight: 600; }
      .box { stroke-width: 1.4; }
      .client { fill: #eff4fc; stroke: #97acc9; }
      .core { fill: #e6f3ec; stroke: #7ba68b; }
      .media { fill: #fff9ee; stroke: #c6a46b; }
      .output { fill: #f1eef8; stroke: #a89bbf; }
      .edge { fill: none; stroke: #496477; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1040" height="826" rx="12" fill="#fff"/>
  <text class="title" x="34" y="44">Native video engine</text>
  <text class="tag" x="1006" y="42" text-anchor="end">Alpha architecture</text>

  <g class="edge" marker-end="url(#arrow)">
    <path d="M268 151 V177"/><path d="M772 151 V177"/>
    <path d="M520 249 V275"/>
    <path d="M268 350 V385"/><path d="M772 350 V385"/>
    <path d="M268 499 V534"/><path d="M772 499 V534"/>
  </g>
  <path class="edge" d="M268 616 V636 H772 V616"/>
  <path class="edge" d="M520 636 V684 M268 684 H772"/>
  <path class="edge" d="M268 684 V706" marker-end="url(#arrow)"/>
  <path class="edge" d="M772 684 V706" marker-end="url(#arrow)"/>
  <rect x="392" y="646" width="256" height="27" rx="6" fill="#fff"/>
  <text class="tag" x="520" y="665" text-anchor="middle">Timed picture + sound</text>

  <rect class="box client" x="34" y="68" width="468" height="83" rx="10"/>
  <text class="label" x="54" y="100">Headless CLI · SDL2 · Electron harness</text>
  <text class="body" x="54" y="128">Request frames, replay edits and inspect output.</text>
  <rect class="box client" x="538" y="68" width="468" height="83" rx="10"/>
  <text class="label" x="558" y="100">Authored project</text>
  <text class="body" x="558" y="128">Read the master, sequence XML and asset registry.</text>

  <rect class="box core" x="34" y="179" width="972" height="70" rx="10"/>
  <text class="label" x="54" y="208">Rust editing core · accepted project revision</text>
  <text class="body" x="54" y="233">Validate file and UI edits, surface conflicts, and save the project.</text>
  <rect class="box core" x="34" y="277" width="972" height="73" rx="10"/>
  <text class="label" x="54" y="306">Timeline evaluator + playback scheduler</text>
  <text class="body" x="54" y="332">Map time to sources, resolve text layout and layer transforms, schedule frame and audio sample requests.</text>

  <rect class="box media" x="34" y="387" width="468" height="112" rx="10"/>
  <text class="label" x="54" y="418">Picture sources</text>
  <text class="body" x="54" y="444">Video · native FFmpeg decode</text>
  <text class="body" x="54" y="467">2D · native SVG painting and paragraph layout</text>
  <text class="body" x="54" y="489">3D · imported USD, native planes and object mattes</text>
  <rect class="box media" x="538" y="387" width="468" height="112" rx="10"/>
  <text class="label" x="558" y="418">Audio sources</text>
  <text class="body" x="558" y="444">Source streams, voice, music and effects</text>
  <text class="body" x="558" y="467">Decode and normalize PCM for the requested range</text>
  <text class="body" x="558" y="489">FFmpeg / libswresample for native conversion</text>

  <rect class="box media" x="34" y="536" width="468" height="80" rx="10"/>
  <text class="label" x="54" y="568">Picture compositor · native wgpu</text>
  <text class="body" x="54" y="595">Layer and group filters, masks, ordered blending</text>
  <rect class="box media" x="538" y="536" width="468" height="80" rx="10"/>
  <text class="label" x="558" y="568">Audio mixer</text>
  <text class="body" x="558" y="595">Source trims, sample timing, gain, fades and summing</text>

  <rect class="box output" x="34" y="708" width="468" height="94" rx="10"/>
  <text class="label" x="54" y="740">Interactive presentation</text>
  <text class="body" x="54" y="765">SDL2 viewer or Electron host with a Rust-owned HUD</text>
  <text class="body" x="54" y="788">Schedule to the audio clock. Cancel stale seeks.</text>
  <rect class="box output" x="538" y="708" width="468" height="94" rx="10"/>
  <text class="label" x="558" y="740">Headless native export</text>
  <text class="body" x="558" y="765">Evaluate exact frames and samples from originals.</text>
  <text class="body" x="558" y="788">Encode picture and sound with FFmpeg, then mux.</text>
</svg>
